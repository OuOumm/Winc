name: SSH Module · Preview Build

# SSH 模块界面原型的本地测试构建（仅 Windows x64）。
# 手动触发后编译 Winc 的 Windows x64 版本，打包成安装包，发布为 prerelease，
# 方便直接下载到本地测试。不做代码签名，不生成签名的更新 feed（appcast），
# 因此不依赖任何仓库 secrets（发布仅用内置 GITHUB_TOKEN）。
#
# 触发：Actions → "SSH Module · Preview Build" → Run workflow
#   可选填写 tag（默认 ssh-module-preview-<short sha>）。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "预览版 tag（留空则用 ssh-module-preview-<short sha>）"
        type: string
        default: ""
      prerelease:
        description: "发布为 prerelease（true）还是正式 release（false）"
        type: boolean
        default: true

permissions:
  contents: write   # 创建 release 并上传产物

concurrency:
  group: ssh-module-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # 预览构建专用占位更新私钥（32 字节 seed）。仅用于让 config.mjs 生成公钥填入构建配置；
  # 预览包不生成签名 feed，因此使用固定的非生产 seed 即可，不影响正式更新通道。
  WINC_UPDATE_PRIVATE_KEY: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="

jobs:
  # ---- 解析来源与预览 tag ----
  prepare:
    name: Resolve preview source
    runs-on: ubuntu-24.04
    outputs:
      source-sha: ${{ steps.meta.outputs.sha }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          sha="${GITHUB_SHA}"
          short="${sha:0:7}"
          tag="${{ inputs.tag }}"
          if [[ -z "$tag" ]]; then
            tag="ssh-module-preview-${short}"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "### SSH 模块预览构建（Windows x64）" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: \`${short}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"

  # ---- Windows：复用官方打包脚本，跳过签名（脚本在无证书时自动跳过）----
  windows:
    name: Windows x64
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      TARGET: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
      - uses: ./.github/actions/build-setup
        with:
          target: ${{ env.TARGET }}
          source-sha: ${{ needs.prepare.outputs.source-sha }}
      - name: Configure build
        run: node release/common/config.mjs --output "$RUNNER_TEMP/build-config.json"
      - name: Compile
        run: |
          cargo build --release --locked --target "$TARGET" -p winc -p winc-pty
          cargo xtask icons "target/$TARGET/release/bundle/icons"
      - name: Compile remote server (Linux static)
        run: cargo xtask server
      - name: Fetch console host
        shell: pwsh
        run: ./release/windows/conpty.ps1 -Destination "target/$env:TARGET/release"
      - name: Compile WSL file watcher
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl -p winc-watch
      - name: Install native packaging tools
        shell: pwsh
        run: |
          choco install nsis --version=3.11 --allow-downgrade --yes --no-progress
          choco install wixtoolset --version=3.14.1 --allow-downgrade --yes --no-progress
      - name: Bundle NSIS and MSI installers
        run: pwsh -NoProfile -File release/windows/package.ps1 -Phase installers -Target "$TARGET"
      - name: Package portable
        shell: pwsh
        run: ./release/windows/package.ps1 -Phase portable -Target $env:TARGET
      - name: Stage raw installers
        shell: bash
        run: |
          set -euo pipefail
          B="target/$TARGET/release/bundle"
          mkdir -p "$RUNNER_TEMP/release-assets"
          find "$B/nsis" -maxdepth 1 -name '*-setup.exe' -type f -exec cp -t "$RUNNER_TEMP/release-assets" {} +
          find "$B/msi" -maxdepth 1 -name '*.msi' -type f -exec cp -t "$RUNNER_TEMP/release-assets" {} +
          find "$B/portable" -maxdepth 1 -name '*-portable.zip' -type f -exec cp -t "$RUNNER_TEMP/release-assets" {} +
          printf 'Windows assets:\n' >> "$GITHUB_STEP_SUMMARY"
          find "$RUNNER_TEMP/release-assets" -maxdepth 1 -type f -printf '  %f\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: preview-windows-x64
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error

  # ---- 发布 prerelease ----
  publish:
    name: Publish preview release
    needs: [prepare, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: preview-*
          path: preview-assets
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd preview-assets
          sha256sum * > SHA256SUMS.txt
      - name: Create / update preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.source-sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=""
          if [[ "$PRERELEASE" == "true" ]]; then flags="--prerelease"; fi
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$SHA" --title "SSH 模块预览 · $TAG" \
              --notes "SSH 资产管理模块本地测试预览构建（Windows x64）。来源 commit: $SHA。安装包未签名，仅供本地测试。" $flags
          gh release upload "$TAG" preview-assets/* --clobber
          echo "预览版已发布：https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
